name: build

on: [push, workflow_dispatch]

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "未格式化文件:"; echo "$out"; exit 1; fi
      - name: Test
        run: go test ./... -count=1

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build all platforms
        run: |
          mkdir -p dist
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${pair%/*}; arch=${pair#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            for bin in argus-server argus-node; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags "-s -w" \
                -o "dist/${bin}-${os}-${arch}${ext}" ./cmd/$bin
            done
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: argus-binaries
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
